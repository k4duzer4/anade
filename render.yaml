# Um serviço gratuito: Next público + Express interno. PostgreSQL no Supabase.
services:
  - type: web
    name: anade
    runtime: node
    plan: free
    region: virginia
    buildCommand: npm ci --include=dev && npm run build
    # O plano Free não dispõe de pre-deploy; migrações versionadas rodam no início.
    startCommand: npm run db:migrate && npm run start:render
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: '24'
      - key: NODE_ENV
        value: production
      - key: API_ORIGIN
        value: http://127.0.0.1:3001
      - key: TRUST_PROXY
        value: '1'
      - key: SESSION_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: DISCORD_CLIENT_ID
        sync: false
      - key: DISCORD_CLIENT_SECRET
        sync: false
      - key: DISCORD_GUILD_ID
        sync: false
      - key: DISCORD_MEMBER_ROLE_ID
        sync: false
      - key: DISCORD_ADMIN_ROLE_ID
        value: ''
